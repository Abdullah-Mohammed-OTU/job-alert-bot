name: Poll job boards

on:
  schedule:
    # Every 15 minutes. GitHub may run scheduled jobs a few minutes late under load.
    # On a PRIVATE repo, change to "*/30 * * * *" to stay inside the 2,000 free minutes/month.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # "Run workflow" button for testing

permissions:
  contents: write         # to commit state/seen.json back

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new postings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Save seen postings
        run: |
          git config user.name  "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen postings [skip ci]"
          git pull --rebase --autostash -q && git push -q
