# New-grad job alert bot config.
# The Discord webhook URL is NOT stored here; it comes from the
# DISCORD_WEBHOOK_URL environment variable / GitHub secret.

[settings]
# Which kinds of tech roles to alert on. Delete any you don't want.
#   software  developer, SWE, web/mobile, embedded, general "engineer"
#   data      data analyst/scientist/engineer, BI, ML/AI, analytics
#   it        IT support, service desk, sysadmin, network, cloud, DevOps/SRE, DBA
#   security  cybersecurity, SOC, IAM, AppSec
#   qa        QA, test automation, SDET
#   product   APM, business/systems analyst, tech consulting, UX/UI, technical writer
categories = ["software", "data", "it", "security", "qa", "product"]

# true  = Canada + US + remote (anything not clearly overseas)
# false = Canada + roles that say "remote"
include_us = true

# false: titles with no level ("Data Analyst", "Software Engineer") still alert, without 🎓.
#        Noisier, but many entry-level roles are titled that way.
# true:  only titles with new grad / junior / entry-level / associate / early talent /
#        rotational / "Analyst I" / Tier 1 / 2026 / 2027 etc. Much quieter.
require_junior_keyword = false

# Optional ping on the first message of each batch, e.g. "<@123456789012345678>"
# (Discord: Settings > Advanced > Developer Mode, then right-click yourself > Copy User ID)
mention = ""

# Safety valve so a misconfigured filter can't spam 300 messages.
max_alerts_per_run = 40

# Any of these regexes can be overridden here; defaults live in jobbot/filters.py.
# exclude_pattern = '...'
# [settings.category_patterns]
# data = '...'

# ---------------------------------------------------------------------------
# Companies. Find the board from any job link at the company:
#   job-boards.greenhouse.io/<slug>/...  or boards.greenhouse.io/<slug>  -> greenhouse
#   jobs.lever.co/<slug>/...                                             -> lever
#   jobs.ashbyhq.com/<slug>/...                                          -> ashby
#   <tenant>.wd3.myworkdayjobs.com/<site>/...                            -> workday (put the url)
# Every board below was confirmed to exist on Oct 12, 2026. Run
# `python bot.py --check` now and then; companies switch ATS every so often.
# ---------------------------------------------------------------------------

